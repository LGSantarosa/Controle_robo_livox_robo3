; O `pytest` sem argumentos coleta SÓ o que é deste projeto.
;
; Antes daqui a coleta era por exclusão: a raiz varria tudo e a gente tirava na
; mão o que atrapalhava (`--ignore=ros2_packages/twist_mux`, de 22-09, e o
; `ESTAGIO-2026/` que apareceu em 23-09). Exclusão por nome não fecha: qualquer
; diretório local NOVO — ignorado pelo git, clonado ao lado, vendorizado —
; entra na suíte sem avisar e derruba o código de saída com teste de terceiro.
; Seleção positiva fecha: o que não está listado aqui não é coletado.
;
; Chamada explícita continua valendo: `pytest ros2_packages/twist_mux` testa o
; terceiro quando a gente QUISER. `testpaths` só decide o default.
;
; A lista é travada por `test_coleta_da_suite.py`: arquivo de teste versionado
; fora daqui reprova. Sem essa trava, seleção positiva troca um jeito de sumir
; (teste de terceiro entrando) por outro (teste nosso saindo em silêncio).
[pytest]
testpaths =
    controle_web
    firmware/mega_bridge/tools
    ros2_packages/robot_base/test
    ros2_packages/robot_motion/test
    ros2_packages/robot_nav/test
    ros2_packages/robot_planning/test
    test_coleta_da_suite.py
    test_import_do_fonte.py
    tools/audita_livox
    tools/banco
    tools/linha_de_base
    tools/sobe_robo3
    tools/valida_etapa4
    tools/valida_etapa5
    tools/valida_etapa6
    tools/valida_etapa7
    tools/ab_freio
    tools/analise_corrida
    tools/subidas_robo3
    tools/sobe_robo3_web
